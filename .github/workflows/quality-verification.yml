name: Quality verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      NEXUS_TEST_DATABASE_ADMIN_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m mypy src tests
      - name: Unit, API, database, tenant, authorization, concurrency and AI tests
        run: >-
          python -m pytest -q
          --cov=nexus --cov-branch --cov-report=term-missing
          --cov-report=json:coverage.json
      - name: Critical module coverage gates
        run: python ../scripts/check_critical_coverage.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e

  load-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Start deterministic benchmark API
        run: python -m uvicorn tests.performance.benchmark_app:app --host 127.0.0.1 --port 8089 --no-access-log &
      - name: Wait for benchmark API
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8089/health/live && exit 0
            sleep 1
          done
          exit 1
      - name: Synthetic load smoke
        run: >-
          python -m locust -f tests/performance/locustfile.py
          --headless --host http://127.0.0.1:8089
          -u 10 -r 5 -t 10s --only-summary --exit-code-on-error 1
